[Application]
name = PyQt6ify Pro
version = 1.0.0
debug = False

[About]
author = PyQt6ify Team
description = Feature-rich PyQt6 application template.
website = https://github.com/elirancv/PyQt6ify-Pro
icon = resources/icons/app.png

[Modules]
logging = True
database = True
menu = True
toolbar = True
status_bar = True

[Window]
start_maximized = True
screen_width = 1024
screen_height = 768
theme = light

[window]
theme = custom

[Canvas]
grid_spacing_horizontal = 200
grid_spacing_vertical = 400
minimum_grid_zoom = 0.2
element_size = 800
element_pen_width = 5
zoom_factor = 1.15
minimum_zoom = 0.01
maximum_zoom = 20
